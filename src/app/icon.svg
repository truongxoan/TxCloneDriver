<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Cyber / Mystic Gradients -->
    <linearGradient id="primaryAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="url(#primaryAura)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Ambient Glow Center -->
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)" />

  <!-- Outer Mystic Hexagram / Bagua Array Ring -->
  <g transform="translate(256, 256)" filter="url(#subtleGlow)">
    <circle r="190" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="14 10" />
    <circle r="160" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="40 18" />
    <circle r="130" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- 8 Bagua Trigram ticks -->
    <circle cx="0" cy="-160" r="5" fill="#38bdf8" />
    <circle cx="113" cy="-113" r="5" fill="#818cf8" />
    <circle cx="160" cy="0" r="5" fill="#a855f7" />
    <circle cx="113" cy="113" r="5" fill="#c084fc" />
    <circle cx="0" cy="160" r="5" fill="#38bdf8" />
    <circle cx="-113" cy="113" r="5" fill="#818cf8" />
    <circle cx="-160" cy="0" r="5" fill="#a855f7" />
    <circle cx="-113" cy="-113" r="5" fill="#c084fc" />
  </g>

  <!-- Yin-Yang / Dao Sĩ Core Symbol with Modern Cyber Stylization -->
  <g transform="translate(256, 256)" filter="url(#neonGlow)">
    <circle r="105" fill="#0b0f19" stroke="url(#primaryAura)" stroke-width="5" />
    <path d="M 0 -105 A 105 105 0 0 1 0 105 A 52.5 52.5 0 0 1 0 0 A 52.5 52.5 0 0 0 0 -105 Z" fill="url(#flameGrad)" />

    <!-- Small Eyes of Yin and Yang -->
    <circle cx="0" cy="-52.5" r="17" fill="#0f172a" />
    <circle cx="0" cy="-52.5" r="8" fill="url(#accentGold)" />

    <circle cx="0" cy="52.5" r="17" fill="#f8fafc" />
    <circle cx="0" cy="52.5" r="8" fill="#4f46e5" />

    <path d="M 0 -95 L 3 -70 L -3 -70 Z" fill="#ffffff" opacity="0.8" />
    <path d="M 0 95 L 3 70 L -3 70 Z" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Cloud / Data Driver Waves beneath -->
  <g transform="translate(256, 400)" opacity="0.85" filter="url(#subtleGlow)">
    <path d="M -90 -10 C -110 -10, -125 5, -125 25 C -125 45, -105 55, -80 55 L 80 55 C 105 55, 125 45, 125 25 C 125 5, 105 -10, 85 -10 C 80 -35, 55 -55, 25 -55 C 5 -55, -15 -42, -25 -25 C -35 -28, -50 -25, -60 -15 Z" fill="none" stroke="url(#primaryAura)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -50 20 L 0 -10 L 50 20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="0" y1="-10" x2="0" y2="35" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Four Mystic Corner Runes -->
  <g stroke="url(#primaryAura)" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 60 120 L 60 60 L 120 60" />
    <path d="M 452 120 L 452 60 L 392 60" />
    <path d="M 60 392 L 60 452 L 120 452" />
    <path d="M 452 392 L 452 452 L 392 452" />
  </g>
</svg>
